services:
  mongodb:
    image: mongo:7
    container_name: reid-mongodb
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - reid-mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok && print('ok');
          } catch(e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
            print('initiated');
          }
        "
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  reid-mongo-data:
